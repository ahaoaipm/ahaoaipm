<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">阿豪 · 产品 内容 AI</title>
  <desc id="desc">阿豪的 GitHub 主页头图：把事情想通，再用人话讲明白，做成别人用得上的产品、文章或工具。右侧三张卡片依次是：想通、讲明白、做出来。</desc>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5B83D" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" rx="28" fill="#0A0A0A"/>
    <circle cx="930" cy="200" r="300" fill="url(#glow)"/>
    <path d="M700 36V364" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
      <g id="title-block" transform="translate(64 0)">
        <text x="0" y="68" fill="#A3A3A3" font-size="18" font-weight="600" letter-spacing="4">PRODUCT · CONTENT · AI</text>
        <path transform="translate(96 0)" d="M242 56l3.4 9.6 9.6 3.4-9.6 3.4-3.4 9.6-3.4-9.6-9.6-3.4 9.6-3.4z" fill="#F5B83D"/>
        <text x="0" y="176" fill="#F5F5F5" font-size="112" font-weight="800" letter-spacing="-2">阿豪</text>
        <text x="256" y="172" fill="#A3A3A3" font-size="30" font-weight="500">@阿豪要发光</text>
        <rect id="title-highlight" x="0" y="194" width="224" height="10" rx="5" fill="#F5B83D"/>
        <text x="0" y="262" fill="#E5E5E5" font-size="30" font-weight="500">把事情想通，再用人话讲明白，</text>
        <text x="0" y="306" fill="#E5E5E5" font-size="30" font-weight="500">做成别人用得上的产品、文章或工具。</text>
        <text x="0" y="360" fill="#737373" font-size="18" font-weight="600" letter-spacing="1.5">ENFJ  ·  武汉  ·  AI产品阿豪</text>
      </g>

      <g id="motion-card-think" transform="translate(724 36) rotate(-1.4 200 52)">
        <rect x="6" y="8" width="400" height="104" rx="18" fill="#000000" fill-opacity=".45"/>
        <rect width="400" height="104" rx="18" fill="#161616" stroke="#2C2C2C" stroke-width="2"/>
        <text x="24" y="42" fill="#F5F5F5" font-size="26" font-weight="700">01 想通</text>
        <text x="24" y="80" fill="#A3A3A3" font-size="20" font-weight="500">真实需求是什么</text>
        <path d="M214 66C226 26 262 24 254 54C248 80 222 78 238 50C252 28 284 38 276 62C272 74 262 70 272 60L372 62" fill="none" stroke="#8A8A8A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="372" cy="62" r="8" fill="#F5B83D"/>
      </g>

      <g id="motion-card-explain" transform="translate(724 148) rotate(1.2 200 52)">
        <rect x="6" y="8" width="400" height="104" rx="18" fill="#000000" fill-opacity=".45"/>
        <rect width="400" height="104" rx="18" fill="#161616" stroke="#2C2C2C" stroke-width="2"/>
        <text x="24" y="42" fill="#F5F5F5" font-size="26" font-weight="700">02 讲明白</text>
        <text x="24" y="80" fill="#A3A3A3" font-size="20" font-weight="500">用人话，不堆术语</text>
        <rect x="226" y="20" width="150" height="64" rx="14" fill="none" stroke="#5A5A5A" stroke-width="3"/>
        <path d="M250 84l-8 14 22-14" fill="#161616" stroke="#5A5A5A" stroke-width="3" stroke-linejoin="round"/>
        <rect x="244" y="33" width="104" height="7" rx="3.5" fill="#8A8A8A"/>
        <rect x="244" y="48" width="78" height="7" rx="3.5" fill="#F5B83D"/>
        <rect x="244" y="63" width="52" height="7" rx="3.5" fill="#8A8A8A"/>
      </g>

      <g id="motion-card-ship" transform="translate(724 260) rotate(-0.8 200 52)">
        <rect x="6" y="8" width="400" height="104" rx="18" fill="#000000" fill-opacity=".45"/>
        <rect width="400" height="104" rx="18" fill="#F5F2EA"/>
        <text x="24" y="42" fill="#0A0A0A" font-size="26" font-weight="700">03 做出来</text>
        <text x="24" y="80" fill="#4A4A4A" font-size="20" font-weight="600">日接管万单发货</text>
        <rect x="226" y="18" width="150" height="68" rx="12" fill="#0A0A0A"/>
        <circle cx="242" cy="32" r="3.5" fill="#F5B83D"/><circle cx="256" cy="32" r="3.5" fill="#5A5A5A"/><circle cx="270" cy="32" r="3.5" fill="#5A5A5A"/>
        <rect x="240" y="46" width="62" height="7" rx="3.5" fill="#8A8A8A"/>
        <rect x="240" y="62" width="44" height="7" rx="3.5" fill="#5A5A5A"/>
        <circle cx="344" cy="58" r="16" fill="#F5B83D"/>
        <path d="M336 58l6 6 11-12" fill="none" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
